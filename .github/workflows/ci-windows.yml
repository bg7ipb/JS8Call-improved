name: CI Build for Windows 10+ x64
run-name: ${{ (github.event.inputs.environment) || (github.event.pull_request.title) || 'CI' }} Build for Windows 10+ x64

on: 
  workflow_dispatch: 
    inputs:
      build-type:
        description: 'Build type (Debug/Release)'
        required: false
        type: string
        default: 'Release'
      release-ver:
        description: 'Release Version (v3.0.0)'
        required: false
        type: string
        default: 'v3.0.0'
      environment:
        description: 'Environment to run in'
        type: environment
        default: CI
        required: false
  pull_request:
  workflow_call:
    inputs:
      build-type:
        description: 'Build type (Debug/Release)'
        required: false
        type: string
        default: 'Debug'
      release-ver:
        description: 'Release Version (v3.0.0)'
        required: false
        type: string      
        default: 'v3.0.0'        
env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

# NOTE Secrets can NOT be accessed from PRs if they are NOT a branch on this repo!
# Please try to quit forgetting that! i know who I'm talking about, you in the mirror!

jobs:
  build_windows-2025:
    runs-on: windows-2025
    permissions: write-all
    environment: ${{ inputs.environment || 'CI' }}
   
    steps:
    - run: git config --global core.autocrlf input
    - uses: actions/checkout@v5
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        cache: true
        install: >-
          git python base-devel make unzip zip tar
        pacboy: >-
          toolchain:p
          autotools:p
          cmake:p
          ninja:p
          libusb:p
          wget:p
          boost:p
          fftw:p
          sqlite3:p
          python:p
          qt6-base:p
          qt6-multimedia:p
          qt6-serialport:p
          qt6-tools:p
          qt6-multimedia-ffmpeg:p
          ntldd-git:p

    - name: Setup build directory
      shell: msys2 {0}
      run: mkdir -p build

# hamlib
    - name: Cache Check Hamlib 4.7.1
      id: cache-hamlib
      uses: actions/cache/restore@v5
      with:
        path: 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib'
        key: ${{ runner.os }}-${{ runner.arch }}-hamlib471

    - name: Install Hamlib 4.7.1
      if: steps.cache-hamlib.outputs.cache-hit != 'true'
      run: |
        New-Item -ItemType Directory -Force -Path 'D:/a/JS8Call-improved/JS8Call-improved/local' | Out-Null
        curl --location --output 'D:/a/_temp/hamlib-w64-4.7.1.zip' https://github.com/Hamlib/Hamlib/releases/download/4.7.1/hamlib-w64-4.7.1.zip
        cd 'D:/a/_temp/'
        unzip hamlib-w64-4.7.1.zip
        mv 'D:/a/_temp/hamlib-w64-4.7.1' 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib'
        mv 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib/lib/gcc/libhamlib.dll.a' 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib/lib/libhamlib.dll.a'
        
    - name: Save Hamlib cache
      if: steps.cache-hamlib.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        key: ${{ runner.os }}-${{ runner.arch }}-hamlib471
        path: 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib'

    - name: Verify Qt6 toolchain (B-plan guard)
      shell: msys2 {0}
      run: |
        set -e
        pacman -Q mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-multimedia mingw-w64-x86_64-qt6-multimedia-ffmpeg mingw-w64-x86_64-qt6-serialport mingw-w64-x86_64-qt6-tools
        ls /mingw64/bin/Qt6Core.dll /mingw64/bin/Qt6Multimedia.dll /mingw64/bin/Qt6SerialPort.dll
        ls /mingw64/bin/lrelease.exe /mingw64/bin/windeployqt.exe
        /mingw64/bin/qmake6.exe --version || /mingw64/bin/qmake.exe --version

    - name: Configure JS8Call
      shell: msys2 {0}
      run: |
        cd ./build
        cmake -DCMAKE_PREFIX_PATH='D:/a/JS8Call-improved/JS8Call-improved/local/hamlib' ..

    - name: Build JS8Call (CI build)
      if: ${{ !(inputs.environment) || (inputs.environment == 'CI') }}
      shell: msys2 {0}
      run: |
        cd ./build
        cmake --build . --config Debug

    - name: Build JS8Call (Release build)
      if: ${{ inputs.environment == 'Release' }}
      shell: msys2 {0}
      run: |
        cd ./build
        cmake --build . --config Release

    - name: Move exe into install directory
      shell: msys2 {0}
      run: |
        cp ./build/JS8Call.exe ./build/JS8Call/

    - name: Deploy Qt runtime (windeployqt, explicit)
      shell: msys2 {0}
      run: |
        /mingw64/bin/windeployqt.exe --no-translations ./build/JS8Call/JS8Call.exe

    - name: Move libraries and License to install directory
      shell: msys2 {0}
      run: |
        cd ./build/
        cp 'D:/a/JS8Call-improved/JS8Call-improved/LICENSE' JS8Call/
        cp /mingw64/bin/libfftw3f-3.dll JS8Call/
        cp 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib/bin/libhamlib-4.dll' JS8Call/
        cp 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib/bin/libusb-1.0.dll' JS8Call/
        cp /mingw64/bin/libwinpthread-1.dll JS8Call/
        cp /mingw64/bin/libstdc++-6.dll JS8Call/
        cp /mingw64/bin/libgcc_s_seh-1.dll JS8Call/

    - name: Walk transitive deps via ntldd
      shell: msys2 {0}
      run: |
        cd ./build/JS8Call/
        command -v ntldd >/dev/null 2>&1 || { echo "ERROR: ntldd not installed"; exit 1; }
        seeds=$(ls *.exe *.dll 2>/dev/null)
        for d in iconengines imageformats multimedia networkinformation platforms styles tls generic; do
          [ -d "$d" ] || continue
          for f in "$d"/*.dll; do
            [ -f "$f" ] && seeds="$seeds $f"
          done
        done
        echo "ntldd seeds: $(echo $seeds | tr ' ' '\n' | wc -l)"
        for f in $seeds; do
          ntldd -R "$f" 2>/dev/null \
            | sed -nE 's|.*=> *([^ ]+).*|\1|p' \
            | { grep -iE 'mingw64' || true; } \
            | while read -r dep; do
                bn=$(basename "$dep")
                src="/mingw64/bin/$bn"
                if [ ! -f "$bn" ] && [ -f "$src" ]; then
                  cp "$src" .
                  echo "  + $bn"
                fi
              done
        done
        echo "ntldd walk done. Top-level DLL count: $(ls *.dll | wc -l)"

    - name: DIAG list build tree (temp, remove after green)
      shell: msys2 {0}
      run: |
        echo "--- build/JS8Call/ (top-level) ---"
        ls -la build/JS8Call/ || true
        echo "--- build/JS8Call/ plugin dirs ---"
        for d in iconengines imageformats platforms styles tls multimedia networkinformation generic; do
          echo "[$d]"
          ls -la "build/JS8Call/$d" 2>/dev/null || echo "  (missing)"
        done
        echo "--- find all plugin dirs anywhere under build/ ---"
        find build -type d \( -name iconengines -o -name imageformats -o -name platforms -o -name styles -o -name tls -o -name multimedia -o -name networkinformation -o -name generic \) 2>/dev/null

    - name: Get secrets (CI)
      if: ${{ !(inputs.environment) || (inputs.environment == 'CI') }}
      shell: pwsh
      run: |
        echo "${{ secrets.CI_CODE_SIGNING_PFX_BASE64 }}" > 'D:/a/JS8Call-improved/cert.base64'
        certutil -decode 'D:/a/JS8Call-improved/cert.base64' 'D:/a/JS8Call-improved/certificate.pfx'
      continue-on-error: true

    - name: Get secrets (Release)
      if: ${{ inputs.environment == 'Release' }}
      shell: pwsh
      run: |
        echo "${{ secrets.RELEASE_CODE_SIGNING_PFX_BASE64 }}" > 'D:/a/JS8Call-improved/cert.base64'
        certutil -decode 'D:/a/JS8Call-improved/cert.base64' 'D:/a/JS8Call-improved/certificate.pfx'
      continue-on-error: false

    - name: Sign JS8Call (CI)
      if: ${{ !(inputs.environment) || (inputs.environment == 'CI') }}
      shell: pwsh
      env: 
        PFX_CERTIFICATE_PASSWORD: ${{ secrets.CI_PFX_CERTIFICATE_PASSWORD }}
      run: |
        cd ./build/JS8Call/
        & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe' sign /fd SHA256 /v /f 'D:/a/JS8Call-improved/certificate.pfx' /p "$env:PFX_CERTIFICATE_PASSWORD" *.exe
        & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe' sign /fd SHA256 /v /f 'D:/a/JS8Call-improved/certificate.pfx' /p "$env:PFX_CERTIFICATE_PASSWORD" libhamlib*.dll
        & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe' sign /fd SHA256 /v /f 'D:/a/JS8Call-improved/certificate.pfx' /p "$env:PFX_CERTIFICATE_PASSWORD" libusb*.dll
        & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe' sign /fd SHA256 /v /f 'D:/a/JS8Call-improved/certificate.pfx' /p "$env:PFX_CERTIFICATE_PASSWORD" libwinpthread*.dll
        & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe' sign /fd SHA256 /v /f 'D:/a/JS8Call-improved/certificate.pfx' /p "$env:PFX_CERTIFICATE_PASSWORD" libfftw3*.dll
      continue-on-error: true

    - name: Sign JS8Call (Release)
      if: ${{ inputs.environment == 'Release' }}
      shell: pwsh
      env: 
        PFX_CERTIFICATE_PASSWORD: ${{ secrets.RELEASE_PFX_CERTIFICATE_PASSWORD }}
      run: |
        cd ./build/JS8Call/
        & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe' sign /fd SHA256 /v /f 'D:/a/JS8Call-improved/certificate.pfx' /p "$env:PFX_CERTIFICATE_PASSWORD" *.exe
        & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe' sign /fd SHA256 /v /f 'D:/a/JS8Call-improved/certificate.pfx' /p "$env:PFX_CERTIFICATE_PASSWORD" libhamlib*.dll
        & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe' sign /fd SHA256 /v /f 'D:/a/JS8Call-improved/certificate.pfx' /p "$env:PFX_CERTIFICATE_PASSWORD" libusb*.dll
        & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe' sign /fd SHA256 /v /f 'D:/a/JS8Call-improved/certificate.pfx' /p "$env:PFX_CERTIFICATE_PASSWORD" libwinpthread*.dll
        & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe' sign /fd SHA256 /v /f 'D:/a/JS8Call-improved/certificate.pfx' /p "$env:PFX_CERTIFICATE_PASSWORD" libfftw3*.dll
      continue-on-error: false

    - name: INNO Setup (Release build)
      if: ${{ (inputs.environment == 'Release') && (inputs.release-ver) }}
      run: |
        cd ./build/
        & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' /F"JS8Call-installer-${{ inputs.release-ver }}_${{ runner.arch }}" ../.github/workflows/scripts/ci-windows-installer.iss

    - name: INNO Setup (CI build)
      if: ${{ !(inputs.environment) || (inputs.environment == 'CI') }}
      run: |
        cd ./build/
        & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' /F"JS8Call-installer-devel_${{ runner.arch }}" ../.github/workflows/scripts/ci-windows-installer.iss

    - name: Installer signtool run (CI build)
      if: ${{ !(inputs.environment) || (inputs.environment == 'CI') }}
      env:
        PFX_CERTIFICATE_PASSWORD: ${{ secrets.CI_PFX_CERTIFICATE_PASSWORD }}
      run: |
        cd ./build/JS8Call/
        & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe' sign /fd SHA256 /v /f 'D:/a/JS8Call-improved/certificate.pfx' /p "$env:PFX_CERTIFICATE_PASSWORD" JS8Call-installer-*.exe
      continue-on-error: true

    - name: Installer signtool run (Release build)
      if: ${{ inputs.environment == 'Release' }}
      env:
        PFX_CERTIFICATE_PASSWORD: ${{ secrets.RELEASE_PFX_CERTIFICATE_PASSWORD }}
      run: |
        cd ./build/JS8Call/
        & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe' sign /fd SHA256 /v /f 'D:/a/JS8Call-improved/certificate.pfx' /p "$env:PFX_CERTIFICATE_PASSWORD" JS8Call-installer-*.exe
      continue-on-error: false
      
    - name: Attestation (Release Only)
      if: ${{ (inputs.environment == 'Release') && (inputs.release-ver) }}
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: '${{ github.workspace }}/build/JS8Call/*'
        
    - name: Upload Artifact (Release build)
      if: ${{ (inputs.environment == 'Release') && (inputs.release-ver) }}
      uses: actions/upload-artifact@v6
      with:
        name: "JS8call-improved_${{ inputs.release-ver }}_${{ runner.arch }}_win64"
        path: |
          ./build/JS8Call/JS8Call-installer*

    - name: Upload Artifact (CI build)
      if: ${{ !(inputs.environment) || (inputs.environment == 'CI') }}
      uses: actions/upload-artifact@v6
      with:
        name: "JS8call-improved_devel_${{ runner.arch }}_win64"
        path: |
          ./build/JS8Call/JS8Call-installer*
          ./build/JS8Call/
